column_width = 120
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
# this codebase writes guard clauses collapsed (`if not ok then return end`);
# the default "Never" would expand every one of them. "Always" is not used
# because it would also collapse multi-line named function bodies.
collapse_simple_statement = "ConditionalOnly"
